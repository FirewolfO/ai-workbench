name: ai-workbench

services:
  image-tool:
    build:
      context: ./image-tool
    restart: unless-stopped
    environment:
      U2NET_HOME: /opt/models
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  model-relay:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/nginx/model-relay.conf:/etc/nginx/nginx.conf:ro

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      AI_WORKBENCH_ADDR: :8087
      AI_WORKBENCH_DB_DSN: /data/ai-workbench.db
      AI_WORKBENCH_ATTACHMENT_DIR: /data/attachments
      AI_WORKBENCH_IMAGE_TOOL_BASE_URL: http://image-tool:8090
      AI_WORKBENCH_ALLOWED_ORIGINS: https://ai.lxvb.top
      AI_WORKBENCH_ENCRYPTION_KEY: ${AI_WORKBENCH_ENCRYPTION_KEY:?set AI_WORKBENCH_ENCRYPTION_KEY}
      AI_WORKBENCH_PERMISSION_API_BASE_URL: ${AI_WORKBENCH_PERMISSION_API_BASE_URL:-http://host.docker.internal:8081/api/v1}
      AI_WORKBENCH_PEOPLE_API_BASE_URL: ${AI_WORKBENCH_PEOPLE_API_BASE_URL:-http://people-edge:8082/api/open/people}
      AI_WORKBENCH_PEOPLE_AUTHORIZE_URL: ${AI_WORKBENCH_PEOPLE_AUTHORIZE_URL:-https://people.lxvb.top/oauth/authorize}
      AI_WORKBENCH_PEOPLE_CLIENT_ID: ${AI_WORKBENCH_PEOPLE_CLIENT_ID:-ai-workbench-ui}
      AI_WORKBENCH_PEOPLE_CLIENT_SECRET: ${AI_WORKBENCH_PEOPLE_CLIENT_SECRET:?set AI_WORKBENCH_PEOPLE_CLIENT_SECRET}
      AI_WORKBENCH_OAUTH_REDIRECT_URIS: https://ai.lxvb.top/oauth/callback
      AI_WORKBENCH_X_BEARER_TOKEN: ${AI_WORKBENCH_X_BEARER_TOKEN:-}
      AI_WORKBENCH_GITHUB_TOKEN: ${AI_WORKBENCH_GITHUB_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      image-tool:
        condition: service_healthy
    networks:
      - default
      - people-services
    volumes:
      - workbench-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:18082:8080
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro

volumes:
  workbench-data:

networks:
  people-services:
    external: true
    name: people-services
